<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Blast</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#050816;color:white;font-family:Arial;overflow:hidden;height:100vh;touch-action:none}
#top{display:flex;justify-content:space-between;padding:12px 16px;font-weight:bold;font-size:18px;background:rgba(255,255,255,0.08)}
#score{color:#ffe600}
#time{color:#00e5ff}
#game{position:relative;width:100%;height:calc(100vh - 52px);overflow:hidden;background:radial-gradient(circle at 50% 20%, #1a1a4a, #050816)}
.star{position:absolute;cursor:pointer;filter:drop-shadow(0 0 12px gold);animation:fall linear forwards;user-select:none;touch-action:none;z-index:5;padding:12px;line-height:1}
@keyframes fall{from{transform:translateY(-60px) rotate(0deg)}to{transform:translateY(110vh) rotate(360deg)}}
.particle{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:6}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);z-index:10;text-align:center;padding:20px}
#over h1{font-size:42px;color:#ffe600;margin-bottom:10px}
#over p{font-size:20px;margin-bottom:20px}
button{background:#ffe600;border:0;padding:14px 28px;font-size:20px;font-weight:bold;border-radius:30px}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);z-index:10;text-align:center;padding:20px}
#start h1{font-size:48px;color:#ffe600;text-shadow:0 0 20px gold}
#start p{margin:14px 0 22px;color:#ccc}
#plus{position:absolute;color:#ffe600;font-weight:bold;font-size:24px;pointer-events:none;z-index:20}
</style>
</head>
<body>
<div id="top"><div>⭐ SCORE: <span id="score">0</span></div><div>⏰ <span id="time">30</span>s</div></div>
<div id="game">
<div id="start"><h1>⭐ STAR BLAST</h1><p>Stars ko tap karo, blast karo!<br>30 second hai.</p><button id="playBtn">▶ PLAY</button></div>
<div id="over"><h1>GAME OVER</h1><p>Score: <span id="final">0</span></p><button id="againBtn">🔁 AGAIN</button></div>
</div>
<script>
let score=0, timeLeft=30, playing=false, timer, spawner;
let game=document.getElementById('game');
let audioCtx=null;
function playPop(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    let o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(600,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(100,audioCtx.currentTime+0.15);
    g.gain.setValueAtTime(0.3,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2);
    o.start(); o.stop(audioCtx.currentTime+0.2);
  }catch(e){}
}
function blast(x,y){
  let colors=['#ffe600','#ff0066','#00e5ff','#7CFF00','#ff9500'];
  for(let i=0;i<16;i++){
    let p=document.createElement('div'); p.className='particle';
    p.style.left=x+'px'; p.style.top=y+'px';
    p.style.background=colors[i%5];
    game.appendChild(p);
    let ang=Math.random()*Math.PI*2, dist=40+Math.random()*80;
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(0)`,opacity:0}],{duration:500,easing:'ease-out'}).onfinish=()=>p.remove();
  }
  let plus=document.createElement('div'); plus.id='plus'; plus.textContent='+10';
  plus.style.left=x+'px'; plus.style.top=y+'px'; game.appendChild(plus);
  plus.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-40px)',opacity:0}],{duration:600}).onfinish=()=>plus.remove();
}
function hitStar(s,e){
  if(!playing) return;
  if(e) e.preventDefault();
  let r=s.getBoundingClientRect(), g2=game.getBoundingClientRect();
  blast(r.left-g2.left+25, r.top-g2.top+25);
  playPop(); score+=10;
  document.getElementById('score').textContent=score;
  s.remove();
}
function spawn(){
  if(!playing) return;
  let s=document.createElement('div'); s.className='star';
  let emojis=['⭐','🌟','💫','✨','🔥'];
  s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  s.style.left=Math.random()*80+'%';
  let dur=2.5+Math.random()*1.5;
  s.style.animationDuration=dur+'s';
  s.style.fontSize=(48+Math.random()*22)+'px';
  s.addEventListener('pointerdown', (e)=>hitStar(s,e));
  s.addEventListener('touchstart', (e)=>hitStar(s,e), {passive:false});
  game.appendChild(s);
  setTimeout(()=>{ if(s.parentNode) s.remove(); }, dur*1000);
}
function startGame(){
  score=0; timeLeft=30; playing=true;
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=30;
  document.getElementById('start').style.display='none';
  document.getElementById('over').style.display='none';
  clearInterval(timer); clearInterval(spawner);
  spawner=setInterval(spawn, 500);
  timer=setInterval(()=>{
    timeLeft--; document.getElementById('time').textContent=timeLeft;
    if(timeLeft<=0){
      playing=false; clearInterval(timer); clearInterval(spawner);
      document.getElementById('final').textContent=score;
      document.getElementById('over').style.display='flex';
    }
  },1000);
}
document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
</script>
</body>
</html>
