<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Blast</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050816;color:#fff;font-family:Arial;overflow:hidden;touch-action:none}
#top{display:flex;justify-content:space-between;padding:12px 16px;font-weight:bold;font-size:18px;background:#111133}
#score{color:#ffe600}
#time{color:#00e5ff}
canvas{display:block;width:100%;height:calc(100vh - 52px);background:radial-gradient(circle at 50% 20%, #1a1a4a, #050816)}
#box{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);z-index:10;text-align:center;padding:20px}
#box h1{font-size:44px;color:#ffe600}
#box p{margin:14px 0 20px;color:#ddd;font-size:18px;line-height:1.5}
button{background:#ffe600;border:0;padding:14px 30px;font-size:20px;font-weight:bold;border-radius:30px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="top"><div>⭐ SCORE: <span id="score">0</span></div><div>⏰ <span id="time">30</span>s</div></div>
<canvas id="c"></canvas>
<div id="box"><h1>⭐ STAR BLAST</h1><p>Stars ko TAP karo!<br>Tap karte hi blast hoga.<br>30 second hai.</p><button id="btn">▶ PLAY</button></div>
<script>
let canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H, stars=[], parts=[], score=0, timeLeft=30, playing=false, timer, lastSpawn=0, audioCtx=null;
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight-52; }
window.addEventListener('resize', resize); resize();
function pop(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    let o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(700,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(120,audioCtx.currentTime+0.15);
    g.gain.setValueAtTime(0.25,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2);
    o.start(); o.stop(audioCtx.currentTime+0.2);
  }catch(e){}
}
function spawnStar(){
  stars.push({x:40+Math.random()*(W-80), y:-40, r:28+Math.random()*14, speed:2+Math.random()*2, emoji:['⭐','🌟','💫','✨','🔥'][Math.floor(Math.random()*5)], rot:Math.random()*6});
}
function blast(x,y){
  let cols=['#ffe600','#ff0066','#00e5ff','#7CFF00','#ff9500'];
  for(let i=0;i<18;i++){
    let a=Math.random()*Math.PI*2, s=2+Math.random()*5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,col:cols[i%5]});
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(playing && Date.now()-lastSpawn>450){ spawnStar(); lastSpawn=Date.now(); }
  for(let i=stars.length-1;i>=0;i--){
    let s=stars[i]; s.y+=s.speed; s.rot+=0.02;
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
    ctx.font=s.r*1.6+'px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='gold'; ctx.shadowBlur=18; ctx.fillText(s.emoji,0,0); ctx.restore();
    if(s.y>H+60) stars.splice(i,1);
  }
  for(let i=parts.length-1;i>=0;i--){
    let p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.life--;
    ctx.globalAlpha=p.life/30; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,6,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
    if(p.life<=0) parts.splice(i,1);
  }
  requestAnimationFrame(draw);
}
draw();
function handleTap(e){
  if(!playing) return;
  e.preventDefault();
  let rect=canvas.getBoundingClientRect();
  let tx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  let ty=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  for(let i=stars.length-1;i>=0;i--){
    let s=stars[i], dx=tx-s.x, dy=ty-s.y;
    if(Math.sqrt(dx*dx+dy*dy) < s.r+22){
      blast(s.x,s.y); pop(); stars.splice(i,1);
      score+=10; document.getElementById('score').textContent=score;
      return;
    }
  }
}
canvas.addEventListener('pointerdown', handleTap);
canvas.addEventListener('touchstart', handleTap, {passive:false});
document.getElementById('btn').addEventListener('click', ()=>{
  score=0; timeLeft=30; playing=true; stars=[]; parts=[];
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=30;
  document.getElementById('box').classList.add('hidden');
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--; document.getElementById('time').textContent=timeLeft;
    if(timeLeft<=0){
      playing=false; clearInterval(timer);
      let box=document.getElementById('box');
      box.classList.remove('hidden');
      box.innerHTML='<h1>GAME OVER</h1><p>Score: '+score+'</p><button onclick="location.reload()">🔁 AGAIN</button>';
    }
  },1000);
});
</script>
</body>
</html>
