<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta charset="utf-8"><title>Indore Mini 3D</title><style>
*{box-sizing:border-box;touch-action:none}body{margin:0;overflow:hidden;background:#8cc9ef;font-family:Arial;color:white}#hud{position:fixed;top:12px;left:12px;background:#142235d9;padding:12px;border-radius:12px;z-index:5;line-height:1.6}#joy{position:fixed;bottom:25px;left:25px;width:120px;height:120px;border-radius:50%;background:#ffffff55;z-index:5}#knob{position:absolute;width:48px;height:48px;left:36px;top:36px;background:#ffcc00;border-radius:50%}button{position:fixed;right:20px;width:80px;height:65px;border:0;border-radius:22px;color:white;font-weight:bold;font-size:16px;z-index:5}#gas{bottom:25px;background:#078b48}#brake{bottom:105px;background:#c33b2c}#msg{font-size:13px;color:#ffe382}canvas{display:block}</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script></head><body>
<div id="hud">INDORE MINI 3D<br>Coins: <span id="money">0</span>/250<br><span id="msg">Collect the yellow coins</span></div><div id="joy"><div id="knob"></div></div><button id="gas">GAS</button><button id="brake">BRAKE</button>
<script>
if(!window.THREE){document.getElementById('msg').textContent='Internet required for 3D. Reload.'}else{
let S=new THREE.Scene();S.background=new THREE.Color(0x8cc9ef);let C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500),R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.appendChild(R.domElement);
S.add(new THREE.AmbientLight(0xffffff,1.5));let L=new THREE.DirectionalLight(0xffffff,1);L.position.set(40,80,30);S.add(L);
function box(w,h,d,col,x,y,z,parent=S){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y,z);parent.add(m);return m}
let g=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshLambertMaterial({color:0x4e8b49}));g.rotation.x=-Math.PI/2;S.add(g);
for(let n=-100;n<=100;n+=50){box(300,.12,12,0x33383e,0,.06,n);box(12,.12,300,0x33383e,n,.06,0)}
for(let x=-125;x<=125;x+=50)for(let z=-125;z<=125;z+=50)box(20,12+(Math.abs(x+z)%17),20,0xc88f70,x,6+(Math.abs(x+z)%17)/2,z);
function car(col){let a=new THREE.Group();box(4,1.3,8,col,0,1,0,a);box(3.2,1.3,3,0x274d68,0,2.2,-.5,a);S.add(a);return a}
let p=car(0x1976d2);p.position.set(0,0,0);let police=car(0xffffff);box(1.6,.4,.5,0xff2222,0,3.1,0,police);police.position.set(-80,0,-50);
let coins=[];for(let i=0;i<5;i++){let m=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,.35,16),new THREE.MeshLambertMaterial({color:0xffd000}));m.rotation.x=Math.PI/2;m.position.set(0,1,-25-i*25);S.add(m);coins.push(m)}
let gas=false,brake=false,steer=0,v=0,a=0,money=0,wanted=false,done=false;let joy=document.getElementById('joy'),knob=document.getElementById('knob');
function bind(id,set){let el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);set(true)};el.onpointerup=el.onpointercancel=()=>set(false)}
bind('gas',x=>gas=x);bind('brake',x=>brake=x);
function move(e){let r=joy.getBoundingClientRect();steer=Math.max(-1,Math.min(1,(e.clientX-r.left-60)/42));knob.style.left=(36+steer*36)+'px'}
joy.onpointerdown=e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);move(e)};joy.onpointermove=e=>{if(joy.hasPointerCapture(e.pointerId))move(e)};joy.onpointerup=joy.onpointercancel=()=>{steer=0;knob.style.left='36px'};
let keys={};onkeydown=e=>keys[e.key]=true;onkeyup=e=>keys[e.key]=false;
let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);let acc=gas||keys.ArrowUp,stop=brake||keys.ArrowDown;
v+=((acc?18:0)-(stop?30:0)-v*1.2)*dt;v=Math.max(0,Math.min(24,v));a+=(steer+(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0))*dt*1.7*(v/10);
p.rotation.y=a;p.position.x-=Math.sin(a)*v*dt;p.position.z-=Math.cos(a)*v*dt;
p.position.x=Math.max(-140,Math.min(140,p.position.x));p.position.z=Math.max(-140,Math.min(140,p.position.z));
C.position.set(p.position.x+Math.sin(a)*15,9,p.position.z+Math.cos(a)*15);C.lookAt(p.position.x,1,p.position.z);
for(let i=coins.length-1;i>=0;i--){let c=coins[i];c.rotation.y+=dt*2;if(c.position.distanceTo(p.position)<4){S.remove(c);coins.splice(i,1);money+=50;wanted=true;document.getElementById('money').textContent=money;document.getElementById('msg').textContent='Police chasing!';if(!coins.length){done=true;document.getElementById('msg').textContent='Mission complete!'}}}
if(wanted&&!done){let dx=p.position.x-police.position.x,dz=p.position.z-police.position.z,d=Math.hypot(dx,dz)||1;police.position.x+=dx/d*13*dt;police.position.z+=dz/d*13*dt;police.lookAt(p.position);if(d<5){wanted=false;police.position.set(-80,0,-50);document.getElementById('msg').textContent='Escaped! Keep collecting'}}R.render(S,C)}loop();
onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)};
}
</script></body></html>
