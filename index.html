<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini GTA - Indore City</title>
<style>body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center}canvas{background:#2d6a2e;display:block;margin:auto;border:3px solid #fff}#hud{padding:8px}button{padding:10px 18px;font-size:18px;border-radius:10px;border:0;background:#ffcc00;font-weight:bold}</style></head>
<body>
<div id="hud">🚔 MINI GTA - INDORE CITY | 💰 Paise: <span id="money">0</span> | ⭐ Wanted: <span id="wanted">0</span> | 🎯 Mission: <span id="mission">Rajwada se Sarafa jao</span></div>
<canvas id="g" width="360" height="560"></canvas>
<div style="padding:10px"><button ontouchstart="k('w',1)" ontouchend="k('w',0)">⬆️</button><br>
<button ontouchstart="k('a',1)" ontouchend="k('a',0)">⬅️</button>
<button ontouchstart="k('s',1)" ontouchend="k('s',0)">⬇️</button>
<button ontouchstart="k('d',1)" ontouchend="k('d',0)">➡️</button>
<button onclick="horn()">📯 Horn</button></div>
<script>
let c=document.getElementById('g'),x=c.getContext('2d');
let p={x:180,y:450,a:-Math.PI/2,s:0},keys={},money=0,wanted=0,mission=0;
let police={x:80,y:80},coins=[{x:180,y:200},{x:100,y:300},{x:260,y:120}];
function k(key,v){keys[key]=v}
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function horn(){let a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();setTimeout(()=>o.stop(),200)}
function loop(){
 if(keys['w']) p.s=Math.min(p.s+0.15,4); if(keys['s']) p.s=Math.max(p.s-0.15,-2);
 if(keys['a']) p.a-=0.06; if(keys['d']) p.a+=0.06; p.s*=0.98;
 p.x+=Math.cos(p.a)*p.s; p.y+=Math.sin(p.a)*p.s;
 if(p.x<20)p.x=20; if(p.x>340)p.x=340; if(p.y<20)p.y=20; if(p.y>540)p.y=540;
 // police chase
 let dx=p.x-police.x, dy=p.y-police.y, d=Math.hypot(dx,dy);
 if(wanted>0){police.x+=dx/d*1.2; police.y+=dy/d*1.2; if(d<25){money=Math.max(0,money-20); wanted=0; alert('Police ne pakad liya! 20 Rs fine'); police.x=80; police.y=80;}}
 x.fillStyle='#2d6a2e'; x.fillRect(0,0,360,560);
 x.fillStyle='#444'; x.fillRect(0,0,360,40); x.fillRect(0,0,40,560); x.fillRect(320,0,40,560); x.fillRect(0,520,360,40); x.fillRect(150,0,60,560); x.fillRect(0,250,360,40);
 x.fillStyle='#fff'; x.font='bold 13px sans-serif'; x.fillText('RAJWADA',10,25); x.fillText('SARAFA',240,25); x.fillText('VIJAY NAGAR',10,545);
 // coins
 coins.forEach((co,i)=>{ if(Math.hypot(p.x-co.x,p.y-co.y)<25){coins.splice(i,1); money+=50; wanted=1; document.getElementById('money').innerText=money; document.getElementById('wanted').innerText=wanted; if(money>=150){document.getElementById('mission').innerText='Mission Complete! Jeet gaye!'; alert('Mission Complete! Tum Indore ke Don ban gaye!');}} x.fillStyle='gold'; x.beginPath(); x.arc(co.x,co.y,10,0,7); x.fill(); });
 // player scorpio
 x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle='#111'; x.fillRect(-22,-10,44,20); x.fillStyle='#00aaff'; x.fillRect(-5,-8,15,16); x.fillStyle='#fff'; x.font='bold 10px sans-serif'; x.fillText('SCORPIO',-20,3); x.restore();
 // police
 x.fillStyle='white'; x.fillRect(police.x-15,police.y-8,30,16); x.fillStyle='red'; x.fillRect(police.x-15,police.y-8,15,16); x.fillStyle='blue'; x.fillRect(police.x,police.y-8,15,16);
 requestAnimationFrame(loop);
}
loop();
</script></body></html>
