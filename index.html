let scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB);

let ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshLambertMaterial({color:0x2d6a2e})); ground.rotation.x=-Math.PI/2; scene.add(ground);
// roads
function road(w,d,x,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,0.5,d), new THREE.MeshLambertMaterial({color:0x333333})); m.position.set(x,0.25,z); scene.add(m);}
road(300,12,0,0); road(12,300,0,0); road(300,12,0,60); road(300,12,0,-60);

let cols=[0xff6b6b,0x4ecdc4,0xffe66d,0xa78bfa,0xff9f43];

let car=new THREE.Group();

let wheelGeo=new THREE.CylinderGeometry(0.8,0.8,0.5,12); let wheelMat=new THREE.MeshLambertMaterial({color:0x000000});
[[-1.8,0.8,2.5],[1.8,0.8,2.5],[-1.8,0.8,-2.5],[1.8,0.8,-2.5]].forEach(p=>{let w=new THREE.Mesh(wheelGeo,wheelMat); w.rotation.z=Math.PI/2; w.position.set(p[0],p[1],p[2]); car.add(w);});
scene.add(car); car.position.set(0,0,20);
// police
let police=new THREE.Group(); let pbody=new THREE.Mesh(new THREE.BoxGeometry(4,1.5,8), new THREE.MeshLambertMaterial({color:0xffffff})); pbody.position.y=1; police.add(pbody); scene.add(police); police.position.set(-30,0,-30);
